<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<title>mine-game</title>

<audio id="soundNormal" src="click.mp3"></audio>
<audio id="soundTNT" src="tnt.mp3"></audio>
<audio id="soundDiamond" src="diamond.mp3"></audio>
<audio id="errorSound" src="errorSound.mp3"></audio>

<script src="main.js" defer></script>

<div id="mainMenu">

    <h1 class="game-title">⛏ Mine Game ⛏</h1>

    <button class="menu-btn" onclick="startGame()">
        ▶ Play
    </button>

    <button class="menu-btn" onclick="openWorldMenu()">
        🌍 World
    </button>

</div>

<!-- WORLD MENU -->

<div id="worldMenu">

    <h1 class="game-title">🌍 Select World 🌍</h1>

    <button class="world-btn" onclick="selectWorld(1)">
        World 1
    </button>

    <button class="world-btn" onclick="selectWorld(2)">
        World 2
    </button>

    <button class="world-btn" onclick="selectWorld(3)">
        World 3
    </button>

    <button class="world-btn" onclick="selectWorld(4)">
        World 4
    </button>

    <button class="world-btn" onclick="selectWorld(5)">
        World 5
    </button>

    <button class="back-btn" onclick="closeWorldMenu()">
        ⬅ Back
    </button>

</div>

<div class="main-layout" id="gameScreen">

  <div class="game-area">
    <h1>💎 Diamond:<span id="diamondCounter">0</span></h1>
    <div class="grid">
      </div>
  </div>

  <div class="controls-area">
    <div>
        <span class="improvmentText">
            <img src="handicon.svg" alt="Click icon" width="50" height="50">
            Drill Power
        </span>
        <span class="improvmentText">Level:<span id="drillUpgradeLevel">1</span></span>
        <button id="upgrade-drill-btm" onclick="upgradeDrill()">upgrade:<span id="drillUpgradeCost">1</span>💎</button>
    </div>
    <div>
        <span class="improvmentText">
            <img src="handicon.svg" alt="Click icon" width="50" height="50">
            Atomic Bomb
        </span>
        <button id="buy-atomic-bomb" onclick="atomicBomb()">Atomic Bomb:100💎</button>
    </div>
    
    
  </div>

</div>

</body>
</html>
